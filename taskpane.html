<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ppt-tools</title>
    <script
      type="text/javascript"
      src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"
    ></script>
  </head>
  <body>
    <main id="app">
      <h1>ppt-tools</h1>
      <section aria-label="Pack">
        <h2>Pack</h2>
        <div class="row">
          <button id="pack-up" type="button">Up</button>
          <button id="pack-down" type="button">Down</button>
          <button id="pack-left" type="button">Left</button>
          <button id="pack-right" type="button">Right</button>
        </div>
      </section>
      <section aria-label="Align">
        <h2>Align</h2>
        <button id="align-heights" type="button">Align heights</button>
      </section>
      <section aria-label="Swap">
        <h2>Swap</h2>
        <button id="swap-positions" type="button">Swap positions</button>
      </section>
      <section aria-label="Status" id="status-section">
        <p id="status" role="status" aria-live="polite"></p>
      </section>
    </main>
    <script type="module" src="/src/taskpane/taskpane.ts"></script>
  </body>
</html>
