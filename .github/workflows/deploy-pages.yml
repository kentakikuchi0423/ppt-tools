name: Deploy to GitHub Pages

# Builds the production add-in and deploys it to GitHub Pages so the
# manifest in dist/manifest.xml points at a real public HTTPS host.
# Recipients download manifest.xml from the deployed URL, register the
# containing folder in PowerPoint's Trust Center as a trusted catalog,
# then add the add-in via Insert → My Add-ins → Shared Folder. See
# INSTALL.md for the recipient-side flow.
#
# Manual trigger via the Actions tab. Requires the repo to have GitHub
# Pages set to "GitHub Actions" as the source (Settings → Pages).

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run validate
      - name: Build the static bundle
        run: npm run build
      - name: Generate the production manifest
        env:
          MANIFEST_HOST: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: npm run manifest:prod
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
